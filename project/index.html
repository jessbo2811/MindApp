<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind App</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="gradient-bg">
        <div class="app-window">
            <div class="app-heading">
                <h1>🧠 Mind App</h1>
            </div>
            <div class="bento-container">
                <div class="bento-item mood-tracker">
                    <h2 class="mood-question">How are you feeling today?</h2>
                    <div class="mood-slider">
                        <div id="mood-expression">😐</div>
                        <input type="range" min="1" max="7" value="4" class="mood-slider" id="slider">
                        <div id="mood-display">Mood</div>
                    </div>
                    <form>
                        <textarea name="comments" rows="10" cols="50">Any comments?</textarea>
                    </form>
                    <button type="submit">Submit</button>
                </div>
                <div class="bento-item weather-dash weather-container">
                    <div class="weather-item">
                        <div id="location"></div>
                    </div>
                    <div class="weather-item">
                        <div id="weather"></div>
                    </div>
                </div>
                <div class="bento-item">
                    Share
                </div>
                <div class="bento-item">
                    See past moods
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
